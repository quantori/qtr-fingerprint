version: '3.8'

services:
  qtr-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    container_name: qtr-fingerprint-service
    ports:
      - "8080:8080"
    environment:
      - ENGINE=BallTreeRDKit
      - PORT=8080
      - FPRATIO=2
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - qtr-network

networks:
  qtr-network:
    driver: bridge